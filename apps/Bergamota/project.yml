name: Bergamota
options:
  bundleIdPrefix: br.com.zesmoi
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_ENTITLEMENTS: ""
    OTHER_SWIFT_FLAGS: "-enable-bare-slash-regex"
targets:
  Bergamota:
    type: application
    platform: macOS
    sources:
      - path: Bergamota
    settings:
      base:
        PRODUCT_NAME: Bergamota
        PRODUCT_BUNDLE_IDENTIFIER: br.com.zesmoi.Bergamota
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Bergamota
        INFOPLIST_KEY_CFBundleDisplayName: Bergamota
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "ios-beryllium control panel"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Bergamota talks to the phone over USB Ethernet (ping, SSH, kernel log on UDP 5140)."
        ENABLE_PREVIEWS: YES
schemes:
  Bergamota:
    build:
      targets:
        Bergamota: all
    run:
      config: Debug
    archive:
      config: Release
