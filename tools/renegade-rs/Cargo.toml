[package]
name = "renegade"
version = "0.1.0"
edition = "2024"
description = "Renegade in Rust: turns an Apple IPSW into a PAC-stripped HFS+ root image for the Poco F1 (Bergamota)"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "renegade-rs"
path = "src/bin/renegade-rs.rs"

[dependencies]
unicode-normalization = "0.1.24"
sha2 = "0.10.9"
sha1 = "0.10.6"
miniz_oxide = "0.8.9"
lzfse_rust = "0.2.1"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
p256 = { version = "0.13", default-features = false, features = ["ecdh", "pkcs8", "pem", "arithmetic"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
lto = "thin"
codegen-units = 4
