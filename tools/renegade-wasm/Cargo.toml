[package]
name = "renegade-wasm"
version = "0.1.0"
edition = "2024"
description = "The Renegade root builder as a WebAssembly module for the Bergamota web flasher (plain C ABI, no wasm-bindgen)"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
renegade = { path = "../renegade-rs" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
